# Keys are tree-sitter capture names plus the editor's own `ui.*` elements.
# Lookup falls back along the dots: `variable.parameter` tries `variable.parameter`
# then `variable`, so a theme only has to name what it wants to change.
#
# A value is either a color, or a table of { fg, bg, bold, italic, underline,
# dim, reverse }. Colors are ANSI names ("blue", "dark_grey"), a 0-255 palette
# index ("117"), or true color ("#8be9fd").

"comment"          = { fg = "dark_grey", italic = true }
"string"           = "green"
"character"        = "green"
"escape"           = "cyan"
"keyword"          = "magenta"
"variable.builtin" = "magenta"
"function"         = "blue"
"type"             = "yellow"
"constructor"      = "yellow"
"constant"         = "cyan"
"attribute"        = "dark_yellow"
"label"            = "dark_yellow"
"operator"         = "dark_cyan"
"number"           = "cyan"
"tag"              = "blue"
"tag.error"        = "red"
# A name that belongs to something: a CSS property, a struct field, a TOML
# key. Seven of the registered grammars capture it and it was uncoloured
# until CSS arrived, where property names are most of the file.
"property"         = "dark_yellow"
"boolean"          = "cyan"
"float"            = "cyan"
# SQL calls its own keywords these.
"conditional"      = "magenta"
"storageclass"     = "magenta"
# CSS gives each at-rule its own capture rather than calling them keywords.
"charset"          = "magenta"
"import"           = "magenta"
"media"            = "magenta"
"namespace"        = "magenta"
"supports"         = "magenta"
"keyframes"        = "magenta"
# The braces of an interpolation - `${}` in a template literal, `{}` in an
# f-string - and the markers markdown is made of.
"punctuation.special" = "dark_cyan"

# Markdown, where the markup is the content. A heading is not a keyword and a
# link is not a string, so they get names of their own.
"text.title"       = { fg = "blue", bold = true }
"text.literal"     = "green"
"text.uri"         = { fg = "dark_cyan", underline = true }
"text.reference"   = "cyan"
"text.emphasis"    = { italic = true }
"text.strong"      = { bold = true }

# The status line names its colors rather than reversing video: the powerline
# separators are drawn in one segment's background over the next one's, which
# needs both to be known. A segment left uncolored falls back to a hairline.
"ui.statusline"    = { fg = "#f8f8f2", bg = "#44475a" }
"ui.statusline.file" = { fg = "#f8f8f2", bg = "#6272a4" }
# The right side's block, and deliberately the file block's colour: it makes
# each half of the line a plain middle between two blocks, rather than a left
# side with two and a right side with one. A background of its own is also the
# whole of what makes it a block - a segment sharing the bar's background gets
# a hairline instead of a wedge, which is what this used to be.
"ui.statusline.info" = { fg = "#f8f8f2", bg = "#6272a4" }
"ui.statusline.position" = { fg = "#282a36", bg = "#bd93f9", bold = true }
# The windows you are not typing in, and the line between side-by-side ones.
"ui.statusline.inactive" = { fg = "#6272a4", bg = "#282a36" }
"ui.window.separator" = { fg = "#6272a4" }
"ui.selection"     = { reverse = true }
"ui.eof"           = "dark_grey"
"ui.mode.normal"   = { fg = "black", bg = "blue", bold = true }
"ui.mode.insert"   = { fg = "black", bg = "green", bold = true }

"ui.tabline" = { fg = "#6272a4", bg = "#282a36" }
"ui.tabline.selected" = { fg = "#282a36", bg = "#bd93f9", bold = true }

"ui.completion" = { fg = "#f8f8f2", bg = "#44475a" }
"ui.completion.selected" = { fg = "#282a36", bg = "#bd93f9", bold = true }
"ui.completion.kind" = { fg = "#8be9fd", italic = true }

"ui.info" = { fg = "#f8f8f2", bg = "#44475a" }
"ui.info.active" = { fg = "#50fa7b", bold = true }

"ui.picker" = { fg = "#f8f8f2", bg = "#282a36" }
"ui.picker.prompt" = { fg = "#282a36", bg = "#bd93f9", bold = true }
"ui.picker.selected" = { fg = "#f8f8f2", bg = "#44475a", bold = true }
"ui.picker.match" = { fg = "#50fa7b" }
"ui.picker.detail" = { fg = "#6272a4" }
"ui.mode.visual" = { fg = "#282a36", bg = "#ffb86c", bold = true }
"ui.cursorline" = { bg = "#44475a" }
"ui.linenr" = { fg = "#6272a4" }
"ui.linenr.selected" = { fg = "#f8f8f2", bold = true }
"ui.search.match" = { fg = "#282a36", bg = "#f1fa8c" }
"ui.bracket.match" = { fg = "#ff79c6", bold = true, underline = true }
"ui.gutter.added" = { fg = "#50fa7b" }
"ui.gutter.modified" = { fg = "#ffb86c" }
"ui.gutter.deleted" = { fg = "#ff5555" }
# Types and parameter names a language server writes into the line.
"ui.inlayhint" = { fg = "#6272a4", italic = true }

# What a language server says: the mark in the gutter, the message at the end
# of the line and the count in the status line take these colours; the text a
# diagnostic covers is underlined, and `diagnostic.underline.error` and the
# rest can colour that too.
"diagnostic.error" = { fg = "#ff5555" }
"diagnostic.warning" = { fg = "#ffb86c" }
"diagnostic.info" = { fg = "#8be9fd" }
"diagnostic.hint" = { fg = "#6272a4" }
"diagnostic.underline" = { underline = true }
