[package]
name = "jack-editor"
version = "0.12.0"
edition = "2024"
# Let-chains, which this uses freely: `if let Some(x) = y && ...`.
rust-version = "1.88"
description = "A terminal text editor with tree-sitter highlighting, vim keys and no configuration to speak of"
license = "MIT"
repository = "https://github.com/rgsoda/jack-editor"
readme = "README.md"
keywords = ["editor", "terminal", "vim", "tree-sitter", "tui"]
categories = ["text-editors", "command-line-utilities"]
# `jack` on crates.io is the audio server's bindings, and on Arch it is what
# jack2 provides - hence a package name that is not what you type.
[[bin]]
name = "jack"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
crossterm = "0.29.0"
grep-matcher = "0.1.9"
grep-regex = "0.1.14"
grep-searcher = "0.1.17"
ignore = "0.4.33"
# `:preview`. Its own parser rather than tree-sitter-md's, which splits a
# document between two grammars and is built for highlighting, not reading.
pulldown-cmark = { version = "0.13.4", default-features = false }
regex = "1.13.1"
ropey = "1.6.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
similar = "3.2.0"
streaming-iterator = "0.1.9"
toml = "1.1.6"
tree-sitter = "0.27.0"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-css = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-html = "0.23.2"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-md = "0.5.3"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-sequel = "0.3.11"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-yaml = "0.7.2"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"

# `^z`: raising SIGTSTP is the whole of it, and there is no other way to ask.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
